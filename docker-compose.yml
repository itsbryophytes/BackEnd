services:
  app:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    container_name: ${APP_NAME:-go-gin-clean-starter}-app
    volumes:
      - .:/app
    ports:
      - ${GOLANG_PORT:-8888}:8888
    environment:
      - RAG_SERVICE_URL=http://rag:8000
    depends_on:
      - postgres
      - rag
    networks:
      - app-network

  rag:
    build:
      context: ../rag
      dockerfile: Dockerfile
    container_name: ${APP_NAME:-go-gin-clean-starter}-rag
    ports:
      - ${RAG_PORT:-8000}:8000
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_CHAT_MODEL=${GEMINI_CHAT_MODEL:-gemini-2.5-flash}
      - GEMINI_EMBED_MODEL=${GEMINI_EMBED_MODEL:-models/gemini-embedding-2}
      - GEMINI_EMBED_DIM=${GEMINI_EMBED_DIM:-768}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
      - POSTGRES_DB=${DB_NAME}
      - ENVIRONMENT=${RAG_ENVIRONMENT:-development}
    depends_on:
      - postgres
    networks:
      - app-network

  nginx:
    image: nginx:latest
    container_name: ${APP_NAME:-go-gin-clean-starter}-nginx
    ports:
      - ${NGINX_PORT:-81}:80
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - app-network

  postgres:
    hostname: postgres
    container_name: ${APP_NAME:-go-gin-clean-starter}-db
    image: pgvector/pgvector:pg15
    ports:
      - ${DB_PORT}:5432
    volumes:
      - ./docker/postgresql/tmp:/var/lib/postgresql/data
      - app-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
      - POSTGRES_DB=${DB_NAME}
    networks:
      - app-network

volumes:
  app-data:

networks:
  app-network:
    driver: bridge
